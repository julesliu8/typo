8,"dateExtra1":22,"dateExtra2":22,"numberExtra1":40,"numberExtra2":40,"textExtra1":22,"textExtra2":22,"isProgram":21,"thumbnails":41,"encodings":50,"partOfSeries":55,"releasedEvent":57,"performers":67,"hasParts":72,"articleWarTestimony":118,"relatedIdentifiers":122,"actors":126,"about":128,"reminiscence":130,"location":133,"event":136,"identifierGroup":137,"nodLik":21},"D0001810427_00000","00000","0001","81",[],[15],"noa50jidai","/das/image/D0001810/D0001810427_00000_S_001.jpg","video","2026-11-10T10:12:00+09:00","9999-12-31T23:59:00+09:00","2026-11-10T10:27:46+09:00",false,null,"self","生徒に“勉強せなあかん”という意欲があった 旧制中学と新制高校で教えて","内山　太門","ウチヤマ　タモン","漁業と林業の町・三重県尾鷲市で、敗戦翌年に旧制中学の教師となる。\\nＧＨＱの方針のもと学校制度が大きく変わるただ中で教師生活を送った。\\nとりわけ、義務教育が中学までの９年間となったことに喜んだ。\\n旧制中学校から新制高等学校へ移行する過渡期の学校で、生徒たちは意欲に満ち、教師として楽しかったという。","2015-11-12","D0001830040_00000\\nD0001830049_00000",[],[32,33,34],"時代＞＞証言・インタビュー","時代＞","時代",[36],"戦後史証言","生徒に“勉強せなあかん”という意欲があった 旧制中学と新制高校で教えて 内山　太門",{"seriesId":22,"episodeId":22,"relatedIdentifiers":39},[],0,{"1":42,"2":44,"3":46,"4":48},{"contentPath":16,"encodingFormat":43,"copyrightNotice":22,"width":22,"height":22},"image/jpeg",{"contentPath":45,"encodingFormat":43,"copyrightNotice":22,"width":22,"height":22},"/das/image/D0001810/D0001810427_00000_S_003.jpg",{"contentPath":47,"encodingFormat":43,"copyrightNotice":22,"width":22,"height":22},"/das/image/D0001810/D0001810427_00000_S_004.jpg",{"contentPath":49,"encodingFormat":43,"copyrightNotice":22,"width":22,"height":22},"/das/image/D0001810/D0001810427_00000_S_005.jpg",{"1":51},{"isDownloadable":21,"objectType":17,"bitrate":22,"sampling":22,"contentPath":52,"encodingFormat":53,"regionsAllowed":22,"duration":54},"/das/D0001810/D0001810427_00000_V_000.f4v","video/mp4","PT28M32.233S",{"name":56,"nameRuby":22,"description":22},"戦後史証言プロジェクト",{"startDate":58,"publishedOn":59,"workPerformed":62,"broadcastRecord":65},"2016-01-09T23:00:00+09:00",{"noaBraoadcastMediaCode":60,"name":61},"1","教育/Eテレ",{"name":63,"title":63,"titleRuby":22,"subtitleRuby":22,"partOfSeries":64},"戦後史証言プロジェクト　日本人は何をめざしてきたのか２０１５年度「未来への選択」",{"name":56,"nameRuby":22},{"year":66},"2016",{"1":68},{"name":25,"nameRuby":26,"description":69,"category":70,"roleName":71},"元　旧制尾鷲中学校・新制尾鷲高校教師","出演","証言",{"001":73,"002":85,"003":96,"004":107},{"type":74,"recId":75,"identifier":75,"clipNumber":76,"name":77,"description":78,"dateList":79,"startOffset":40,"endOffset":81,"thumbnailPath":82,"performers":83},"Clip","D0001810427_00000_001_0001","001","「こんなうれしいことはなかった」 中学が義務教育に","私が昭和８年（１９３３年）に旧制（三重県立尾鷲）中学校へ入ったんです。その時の進学率、旧制中学校・女学校へ行くのは１０％なんです。ちょうど１００人卒業生があって、１０人。男子５人と女子５人と、１０人私の小学校では行きました。だから大体それで中学校・女学校共に１クラス、５０人定員の１クラス募集ですから、そうなると大体１０％がかろうじて旧制中学校・女学校に進学していったと。それから尾鷲中学校、旧制の。女学校が２倍の１００人定員になった時がある。これは昭和１７年（１９４２年）です。ですから私から大体１０年後だった。その時に２クラスになったってことは大体２０％ではないかと思う、進学率が。そういうことを考えますと、\\n（１９４７年に学制が改革されて）小学校６年を卒業して、終了して、新制中学へ全部行くんですから、義務教育で。これはもう大変なことです。私はうれしかったです。僕と一緒に小学校の時、数学や国語を競争しとった、よくできた人たちが家庭の事情で中学校へ行けなかった。その人たちも（旧制中学と）違うけれども、中学校、新制中学校へ行けるわけですから、あーよかったと私は非常に嬉しかったです。そのことがもう生徒にもイキイキ出てました。\\nそれからもう一つ（戦前は）尾鷲の方のこの地区では、もう尾鷲の尋常小学校（明治以来の初等教育機関、１９４１から国民学校に変更）を出ると、いわゆるもう就職しておった。奉公ですね、丁稚（でっち）奉公みたいな。中学校に行く者、女学校に行く者、これは微々たるもので、あとはもう漁師、この辺だと第一次産業ですから。林業か漁業かそれともうちの商売の手伝いをするか。もう丁稚奉公に名古屋・大阪方面に出るか、そういう状態でしたから、（１９４７年に中学まで義務教育となって）もう非常に子どもたちはうれしかったと思います。中学校へ行くってことは。私もうれしかったです、こんなうれしいことはなかった。このことがやっぱり日本の教育水準の向上っていうことに大きな力になったと思いますね。ＧＨＱで与えてもらった、これがいちばん私、恵みだと思ってます。",[80],"2015_11_12",255.154,"/das/image/D0001810/D0001810427_00000_C_001.jpg",{"1":84},{"name":25,"nameRuby":26,"category":70},{"type":74,"recId":86,"identifier":86,"clipNumber":87,"name":88,"description":89,"dateList":90,"startOffset":91,"endOffset":92,"thumbnailPath":93,"performers":94},"D0001810427_00000_002_0001","002","「１８０度の転換」　敗戦直後の旧制中学校","Ｑ：先生は復員というか・・、中国に？\\n\\n中支です。３年行ってました。\\n\\nＱ：具体的にどこだったんですか？\\n\\n主として漢江（長江の支流）を中心にしてです。最後は漢江の手前の武昌（長江に面する湖北省武漢市の一部）っていうところがありますが、そこで終戦になりました。もっと具体的に言いますと、洞庭湖（湖南省北東部の湖）ってご存知ですよね？あの湖畔にいたんです。\\n\\nＱ：じゃあ、こっちに引き揚げてきたのはいつになりますか？\\n\\nはい。（昭和）２０年（１９４５年）の８月１５日が終戦ですから、その１年先の７月２１日、２１年の７月２１日に復員しました。\\n\\nＱ：そして、まぁその間はじゃあ中支で捕虜、捕虜というか。\\n\\n１年間、約１年捕虜ですね。なんていうか束縛されて。\\n\\nＱ：それは大変ではなかった。\\n\\nいえ、大変ではありません。ただ食べるものがなかったですから、苦しみました。洞庭湖の貝を採って食いつないでいました。ニラとね。青いものはニラと、カエルと貝とそれだけですね。\\n\\n私ちょうど連隊本部の方で、共産党に対する情報教育をやっとったものですからね、新四軍って新編第四軍（長江中下流域の中国共産党軍が、国共合作により１９３７年に国民政府軍に編入されたもの）っていうやつですね。それが大分勢力を得て、蒋介石がちょっと手こずってきたところですね。\\n\\nＱ：よくそれですんなり１年で帰してもらえたんですね。\\n\\n私なんかまぁペーペーですから、まぁポツダム少尉（ポツダム宣言受諾後に少尉に進級）にはなりましたれども、１年で帰りました。連隊長は留められました。\\n\\nＱ：（昭和）２１年（１９４６年）の７月に帰ってこられて、もうその時の様子はどうだったんですか、この尾鷲の様子っていうのは。\\n\\n予想してたよりは落ち着いておりました。そして８月の３１日付で私三重県立尾鷲中学校に奉職したわけです。\\n\\nＱ：それは旧制中学？\\n\\nええ、旧制中学です。\\n\\nＱ：先生実際その当時の教師として教べんに立ちながら同時に新制中ができるのを見ていたんだと思うんですが、その辺の様子ってどんな感じだったんですか？\\n\\nお話を聞きますと、終戦直後は非常に混乱しておったようですね、教師も生徒も。教師は適格審査（ＧＨＱは教職者を審査し、軍国主義教育を主導したと判断した者を学校から追放した）の件で罷免になるんじゃないかっていう恐々としとったようです。それから、生徒は割合に落ち着いてましたね。動員から帰ってきて、タバコ吸ったりですね、いろいろな生徒おりましたけども、私が予想してたよりは落ち着いておりました。\\n\\nＱ：学校は当時どんな感じで新制中は作られていったんですか？\\n\\n昭和２１年に中学校は５年生までありました、１年から５年までね。そして２１年の終わりごろに例のここにも書いてありますが、新しい小学校、中学校令が出て、もちろん６・３・３・４制という新しい学校制度がやるぞという、あれが出されました。それで今の入ってる中学校１年の生徒はどうなるんだろうかという心配をしておったんですが、次の通達で昭和２１年の１年、２年までは（中学在学中に）新制中学にあたるわけですね。翌年２２年から（新制中学が）発足するわけですから。それでそれが２１年ですから、２２年に新制中学が発足する。そのために（昭和２２年は）旧制中学校・女学校のほうは１年生の入学がなかったんです。だから（旧制度の入学者は、２年生から６年生までの）４学年しかいなかったわけです。そのうちの２年生と３年生は、旧制中学校・女学校の併設新制中学校という名前で（旧制）中学校でかかえとったわけです。これを見た、見たというか知ったＧＨＱがこれはおかしいじゃないかと言って、文句を言ったようですけども、施設がないものですから、やむをえず１年間だけは置こうということで、それで併設中学校（という名前）で旧制（中学校）で一緒にいたわけです。だからその時には旧制中学校と新制中学校と２つが合併した中学だったわけです。\\n\\nＱ：すると新しい教科書っていうか、カリキュラムも新しいものが来る、来たんだと思うんですけど、どんな教育だったんですか。どんなことを新しい中学生には教えたんですか、先生。\\n\\n（ＧＨＱの方針に基づいて）公民っていうのが出てきましたね。それで修身がなくなった。国史がなくなった。地理がなくなった。つまりなくなったというよりもこれはダメだっていうので、悪い部分が多かったものですから、やらさなかったと思います。つまり教科目の制限と教科書の削除、教材の削除。そういうものが非常に多かったです。それで県から与えられてくる教科書というのは、ちょうど新聞紙のようなものでしてね、これを折り曲げて製本しとったんです。ところがそれ鉛筆で書きますと、質が悪いものですから破けちゃうんですね。もう生徒は苦労しておりました。ま、そんなとこですね。教師の面では、今言った軍国主義、それから国家主義的な教師は罷免されましたね。私はそれはあんまり知りません、その前の年ですから。まぁ私が行った時には落ち着いておりました、だいたい先生方がね。それから教師、生徒の方は今言った教科書がそういう形で、特に軍国主義的な部分は国家主義的なところは全部消せっていうわけで墨で消しましてね、ひどい時には１ページもほとんどないちょっと残ってるっていうようなとこもありました。そういう墨塗り教科書っていうのが、皆いっとったんですね。それから教師の面でね、（戦時中は）もう一つ自由主義者、それから軍隊に反抗したような言動をとったような人たちが追放された時期があったようです。私知りません、それは戦時中だと思うんです。その人たちを優先的に復職させました。これも教員にとっては驚きだったですね。\\n\\nＱ：当時のその中学校の雰囲気っていうのは、新しいなんか希望みたいな。\\n\\nこれはね、（戦時中は）生徒はほとんどもう授業をやってないんですね、聞いてみると。軍需工場の学徒動員で。工場へ行って、ここから松阪ってご存知ですか。松阪によく行ったんです。行ったようです、私は行きません、教師も一緒に。そして空襲を受けて、防空壕（ごう）に逃げる。もうほとんど苦労をしたようですね。逃げる逃げまどって。もうそれから解放されて、ああよかったっていう感じでですね。まぁ生徒は割合のびのびしてました。\\nそれから一つ、私が（１９４６年の）９月１日に奉職した時に（旧制中学校の）グランドは全部芋だけだったんです。あれと思って、私は陸上競技やってましたから。あらーこりゃあ体育なんかどうするんだろうなって思って。そうしたら１０月の終わりごろから生徒が、５年生の生徒が「先生、運動会やろうや。わしらやったことないんや」っていうことで、「そうか、やるか。だけどお前あそこに先生方の芋がいっぱい植わっとるぞ、まだ」って。そうしたら「あんなもの先生、引いたったらええんや」「いや、それはちょっと待てよと。大体あの人たちにも予定があるだろうからね、俺ちょっと聞いたるわ」言うて、それでちょっと先生方に聞いたら、「あとまぁ１か月くらいせんと、まぁ１２月の初めやな」言うんですわ。これではとても運動会はできませんでね、１２月では。それで、生徒が私とこへ来て、私陸上競技やっとったものですから。「先生、どんな運動会する？」言うんで「陸上競技をやれ。種目、陸上競技の種目でやれよ」って言ったら、「やります」って言って。それでもうそれ以上私言わなかったんですが、生徒は１１月の半ば頃でしたね。ちょうど今からもうちょっと先だった。先生の芋を全部引き抜いて、ピラミッド型に立てて、「何々先生の芋」ってこうみんな立てて、そしてグラウンドを作ったんだ。フィールドを整備したんです。砂場の砂がないから「先生、学校で入れてくれんか？」って言うから「何を言うか」って言って、私生徒に全校集会の時に「明日から風呂敷を１枚必ず持って来い」と言って持たせてこさせました。そして学校が終わったらすぐに海岸へ行って。近いんです、海岸はね。国市（くにし）の浜っていう海岸で「砂を持って来い、一握の砂を持って来い」って言ったら、もうみんな喜んで持ってきて、とうとう砂場ができました。そうして１１月の終わりに運動会を、戦後初めての運動、体育祭を初めて。楽しかったです。そんな思い出もあります。\\n\\nＱ：そうやってやっぱり学校が手作りっていうかもうですね、いろいろ整ってはないけどみんなでって感じでだったんですかね。\\n\\nはい。\\n\\n生徒たちがやっぱり勉強せなあかんっていうそういう意欲が非常にあったんです。だから授業はしやすかったです。\\n\\nＱ：それだけみんな飢えていた？\\n\\nそうなんです。",[],255.188,1047.679,"/das/image/D0001810/D0001810427_00000_C_002.jpg",{"1":95},{"name":25,"nameRuby":26,"category":70},{"type":74,"recId":97,"identifier":97,"clipNumber":98,"name":99,"description":100,"dateList":101,"startOffset":102,"endOffset":103,"thumbnailPath":104,"performers":105},"D0001810427_00000_003_0001","003","「１８０度の転換」　敗戦直後の旧制中学校（２）","Ｑ：当時のＧＨＱというかＣＩＥ（民間情報教育局。ＧＨＱの部局の一つで、教育改革を監督した）の方針ていうのはやっぱり学校にも伝わってきましたか？\\n\\nええ。これはもうなんていいますか、教育方針がいちばん先に。私のそれは（昭和）２０年（１９４５年）の１０月２２日に三重県の佐々木仁三郎（県立津高等学校、三重県教育委員会委員長など歴任）っていう、やがて津高（県立津高等学校）の校長をしたんですけど、その方が、なんとか秘録（「三重県終戦秘録」）それを出されましてね。その秘録に詳しく載ってるんですわ。それによりますと、まず教育方針のほうは軍国主義思想、それから極端な国家主義思想の持ち主はもう罷免と。厳正な審査をして追放するということをはっきり書いてありました。だからもう教師が戦々恐々として落ち着かなかったようです。\\n\\nＱ：ＣＩＥの狙いっていうのはなんだったっていうふうに教師の間では思ったのですか？\\n\\nそれはもう１８０度の転換ですねもう。今までこうしろっていうことが、やっちゃいけないっていう。昨日までは正義だったことが、今日はもう偽りのことになってしまいましたから。完全な偽りだってことになりましたので。その点では、あまり混乱はしてませんでしたけども、割合中学の教師ってのんびりしてましたよ。思ったよりも、私たちの方がむしろまだ軍国主義のあれがあったかもしれませんけど、軍隊行ってましたから。それでも楽しかったです。\\n\\nＱ：先生は何の教科だったんですか？\\n\\n英語持ってました。はい。\\n\\nＱ：子どもたちに何を当時いちばん教えようっていう方針だったんですか？\\n\\nそうですね、アメリカの風物をよーく説明しました。逆に。今までアメリカ人は戦時中は日本をものすごく研究した。そのことがやっぱり日本の攻撃に対するいろんな策を講じたということをちょっと見たものですから。これはもうアメリカの風物を教えないかんというんで、私英米文学の風物詩をよーく読んで、それをよーく話しました、生徒に。まず単語を覚えるにしても、単語はその風物から出てくる単語なんだから風物を覚えようって言っていろんな制度やあれをお話ししました。\\n\\nＱ：それは戦時中は敵性語だった？\\n\\nそうなんです、はい。\\n\\nＱ：でも今度は逆にすごくアメリカ理解のためにも重要になってきたってことですね。そこら辺は生徒も熱心に学んでいたんですか？\\n\\nよく聞きました。それから低学年の方にはもうシェークスピアの物語とかね、シェイクスピアは読めませんから、難しくて。ラム（１７７５－１８３４チャールズ・ラム　英国の作家）の「シェイクスピア物語」（シェイクスピアの戯曲を分かりやすく物語にしたもの）なんてのを話してね、関心をもうどんどん英語に持っていきました。\\n\\nそれからいちばん話したのは、基本的人権の尊重っていうこと、これをやっぱり話しました。これは私軍隊におる時からそれを感じておりましたからね。やっぱり自由ということと基本的人権の尊重ということ。これはもう「自由とは」っていうようなこともよく話しました。\\n\\nＱ：やっぱりそれはもう学校全体の方針でもあったということですか？\\n\\nそうですね。校長がそういうふうにしてくださいっていうことの指示がありましたし、校長の話がよくありましたね。\\n\\nＱ：そこら辺はＣＩＥていうかＧＨＱの方針を。\\n\\nもちろん、それを受けての校長の話だと思うんですけども。\\n\\n教員になった時の写真があります。旧制中学校５年生を連れて、これです。これ私です。まだ学生服で、教員は学生服着てましたから。\\n\\nＱ：学生服で先生をやってたんですか？\\n\\nはい、背広がなかったですもの、終戦後で。\\n\\n内山さんの妻（廉子さん）：軍服で先生ですね、着たまんま。\\n\\n内山さん：うん、みんな軍服でしたよ、まだ先生方。\\n\\nこれです。これが私です。これが、これは一人ですからね。\\n\\nＱ：これは学生服ですね。\\n\\nはい、でも頭（髪）伸ばしてるから教員。\\n\\nＱ：それが目印になるんだ。\\n\\nああそうなんです。\\n\\nＱ：子どもたちは坊主なんですね。\\n\\nええ、まだ坊主ですよ。５年生です、これみんな。これ第一回のあれが、終戦後第一回の陸上競技大会があって連れて行ったんですわ。\\n\\nもうこの人は８６ですから、今。みんな。\\n\\n内山さんの妻（廉子さん）：教え子が。\\n\\nＱ：この時何歳だったんですか？\\n\\nこの時、２６ですね。だな、この写真やな。これしかないね、もう。あんまり僕は撮ってないな。",[],1047.713,1473.672,"/das/image/D0001810/D0001810427_00000_C_003.jpg",{"1":106},{"name":25,"nameRuby":26,"category":70},{"type":74,"recId":108,"identifier":108,"clipNumber":109,"name":110,"description":111,"dateList":112,"startOffset":113,"endOffset":114,"thumbnailPath":115,"performers":116},"D0001810427_00000_004_0001","004","「男女共学が励みになった」 新制高等学校が発足","（昭和）２３年に高等学校が発足し旧制中学も女学校も校舎を全部新制中学校に明け渡しました。そして私たちは尾鷲小学校の校舎の一部を借りて、そこへ高等学校は移ったんです。机と椅子を私なんかは矢浜というところから、このこちらの尾鷲の街まで行列をして全部で運んだんです。女学校も持って行きました。そして、小学校へ入りました。教室へ入ったらガラス窓が一枚もないんです。まだ５月でよかったですけど、だんだん寒くなってきて風がピューピュー入ってくる。その中で授業をしました。その時にＧＨＱでは、小学校と教員養成所に優先して施設を与えよっていうのが指令でしたから、もうやむをえず私たちが明渡したわけですね。でも、授業は楽しかったです。女学校と中学校が一緒になり、男女共学という大きな賜物（たまもの）が出てきましたからね。これはもう生徒も励みになった、お互いに励みになったし。私たち中学校の時には女学校の体育祭を見に行って停学になったのもおるんですからね。そういう時代の者が教師になってるわけです。男女共学なんて夢物語ですよね。小学校の３年までは共学だったですけど４年からはみんな離されましたから、だから長い間共学なんてのを感じてません。それが思春期の共学ですから。それはもう教室の中は静かなものでした。よく勉強しますしね。\\n\\nＱ：教える方もね、新しい体験ですね。\\n\\nそうなんですね。私はまぁ中学ばっかだったですけど、女学校から来た人は男の生徒はやりにくいって言ってました。乱暴するんじゃないかと思って。私らはもうむしろ中学校ばっかりにおったものですから、女生徒の扱いが分からなくて、私が出席簿読む時に呼びつけで、バッと呼び捨てで名前を呼ぶと、「え」って女の子は。後で生徒の話を聞いたんですけど、女学校では「何々さん」とさん付けだそうですね。中学校へ行ったらみんな中学校の先生は呼び捨てですから怖かったそうです。まぁ、そんなこともありました。",[],1473.705,1712.21,"/das/image/D0001810/D0001810427_00000_C_004.jpg",{"1":117},{"name":25,"nameRuby":26,"category":70},{"profileText1":27,"displayName":119,"performerDescription":22,"dateOfInterview":120,"profileText2":121},"戦後史証言プロジェクト：日本人は何をめざしてきたのか：２０１５年度「未来への選択」：第５回　教育～”知識”か”考える力”か～","reserved-42320x1F","\u003Cdt>１９２０年\u003C/dt>\u003Cdd>三重県尾鷲町（現尾鷲市）生まれ\u003C/dd>\\n\u003Cdt>１９４３年\u003C/dt>\u003Cdd>専修大学経済学部卒業\u003C/dd>\\n\u003Cdt>　\u003C/dt>\u003Cdd>陸軍入隊、中国戦線へ\u003C/dd>\\n\u003Cdt>１９４５年\u003C/dt>\u003Cdd>太平洋戦争敗戦\u003C/dd>\\n\u003Cdt>１９４６年\u003C/dt>\u003Cdd>中国から復員\u003C/dd>\\n\u003Cdt>　\u003C/dt>\u003Cdd>三重県立尾鷲中学校（旧制）の英語教師に\u003C/dd>\\n\u003Cdt>１９４８年\u003C/dt>\u003Cdd>旧制尾鷲中学校が三重県立尾鷲高等学校に改編されるに伴い同高校教師に\u003C/dd>\\n\u003Cdt>１９７３年\u003C/dt>\u003Cdd>三重県立木本高等学校校長\u003C/dd>\\n\u003Cdt>１９７８年\u003C/dt>\u003Cdd>三重県立尾鷲高等学校校長\u003C/dd>\\n\u003Cdt>１９８１年\u003C/dt>\u003Cdd>退職\u003C/dd>\\n\u003Cdt>　\u003C/dt>\u003Cdd>尾鷲市社会教育委員長、三重県社会教育理事、尾鷲市社会福祉協議会長を歴任\u003C/dd>",{"archivesProgramIdentifier":123,"postwarNewsIdentifiers":124,"testimonryClipIdentifiers":125},"D0001820047_00000",[],[],{"1":127},{"name":22,"nameRuby":22},{"1":129},{"name":25,"nameRuby":26,"jobTitle":69,"description":121},{"category":22,"keywords":131,"questions":132,"yearHint":22},[],[],{"prefecture":134,"address":22,"latitude":22,"longitude":22,"precision":22,"building":22,"hasmap":135},[],{"name":22,"url":22},{"date":80,"name":22},{"tvSeriesId":22,"tvSeasonId":22,"tvEpisodeId":22,"radioSeriesId":22,"radioSeasonId":22,"radioEpisodeId":22,"webContentId":22,"archivesIdArchivesdb":22,"archivesIdOpenLibrarydb":22,"archivesIdNod":22},"",{"_layout":140},"archives-movies-jidai",{"UtVyrvELk4":22},true,"/archives/movies/?id=D0001810427_00000"]</script>

9,"dateExtra1":23,"dateExtra2":23,"numberExtra1":41,"numberExtra2":41,"textExtra1":23,"textExtra2":23,"isProgram":22,"thumbnails":42,"encodings":51,"partOfSeries":56,"releasedEvent":58,"performers":68,"hasParts":73,"articleWarTestimony":163,"relatedIdentifiers":167,"actors":171,"about":173,"reminiscence":175,"location":178,"event":181,"identifierGroup":182,"nodLik":22},"D0001810087_00000","00000","0001","81",[14],"青森県",[16],"noa50jidai","/das/image/D0001810/D0001810087_00000_S_001.jpg","video","2026-11-10T10:12:00+09:00","9999-12-31T23:59:00+09:00","2026-11-10T10:23:34+09:00",false,null,"self","「開発」から「核燃」へ 揺れ続けた六ヶ所村","松下　志美雄","マツシタ　シミオ","下北半島の付け根にあり核燃料サイクル基地が立地する六ヶ所村。かつては村民のほとんどが出稼ぎで暮らしを立てる寒村だった。その村に工業開発や核燃料サイクルの立地計画が持ち上がると、そのたび村民は賛否に二分され、激しい対立を繰り返した。人口が最も多い泊地区に生まれ育った松下さんは、対立に巻き込まれ翻弄されながら、村の変貌を見つめ続けてきた。","2013-11-30","D0001831031_00000",[],[33,34,35],"時代＞＞証言・インタビュー","時代＞","時代",[37],"戦後史証言","「開発」から「核燃」へ 揺れ続けた六ヶ所村 松下　志美雄",{"seriesId":23,"episodeId":23,"relatedIdentifiers":40},[],0,{"1":43,"2":45,"3":47,"4":49},{"contentPath":17,"encodingFormat":44,"copyrightNotice":23,"width":23,"height":23},"image/jpeg",{"contentPath":46,"encodingFormat":44,"copyrightNotice":23,"width":23,"height":23},"/das/image/D0001810/D0001810087_00000_S_003.jpg",{"contentPath":48,"encodingFormat":44,"copyrightNotice":23,"width":23,"height":23},"/das/image/D0001810/D0001810087_00000_S_004.jpg",{"contentPath":50,"encodingFormat":44,"copyrightNotice":23,"width":23,"height":23},"/das/image/D0001810/D0001810087_00000_S_005.jpg",{"1":52},{"isDownloadable":22,"objectType":18,"bitrate":23,"sampling":23,"contentPath":53,"encodingFormat":54,"regionsAllowed":23,"duration":55},"/das/D0001810/D0001810087_00000_V_000.f4v","video/mp4","PT51M53.366S",{"name":57,"nameRuby":23,"description":23},"戦後史証言プロジェクト",{"startDate":59,"publishedOn":60,"workPerformed":63,"broadcastRecord":66},"2014-01-18T23:00:00+09:00",{"noaBraoadcastMediaCode":61,"name":62},"1","教育/Eテレ",{"name":64,"title":64,"titleRuby":23,"subtitleRuby":23,"partOfSeries":65},"戦後史証言プロジェクト　日本人は何をめざしてきたのか２０１３年度「地方から見た戦後」",{"name":57,"nameRuby":23},{"year":67},"2014",{"1":69},{"name":26,"nameRuby":27,"description":70,"category":71,"roleName":72},"六ヶ所村住民\\n（新聞販売店経営）","出演","証言",{"001":74,"002":86,"003":97,"004":108,"005":119,"006":130,"007":141,"008":152},{"type":75,"recId":76,"identifier":76,"clipNumber":77,"name":78,"description":79,"dateList":80,"startOffset":41,"endOffset":82,"thumbnailPath":83,"performers":84},"Clip","D0001810087_00000_001_0001","001","集団就職列車で愛知県へ","ここ（泊地区）はね、うちの記憶にあるのは、主力が漁業なんだけどメインがイカね。だから、夏から秋にかけてはもう・・いまのように生で出荷するというのじゃなく、全部とってきたイカを（干して）スルメに加工する、それから出荷するという流れだから、家族総出での作業をしてるわけね。それが、ものすごい活気があったわけ。いまは機械化でそんなに人が要らないんだろうけども、当時はみんな一艘の船に１０人とか１５人とか、そういう「釣り子」（自らは漁船を持たず、船主から甲板にスペースを借り受けてイカを釣った漁業労働者）っていうのがあって雇用があるからね、だから年がら年中イカ漁で生活ができたという地域だから。\\n\\nＱ：松下さんのところは、お父さんも漁師さん？\\n\\nそうですね。\\n\\nＱ：やっぱりイカとってたんですか？\\n\\nイカですね。うちの一番上の兄もね、長男も次男もイカ。要するに「中学生のイカ釣り」というね、国会でも問題になったような。まぁ、当時の労働監督署が特例で、「釣り子」ということで、中学生も労働してもいいと特別許可が出てね、そういう、うちの兄たちの世代だからね、それぐらいイカが活気があったということですね。だから、そういうなかで、うちら子どもだから、やっぱりそれをお手伝いするという・・ひとつの労働力ですよね、子どもも。\\n\\nＱ：イカを干したり？\\n\\nそうです。運んで加工、割いて。乾燥させてね。\\n\\nＱ：子どもの頃から、そういうことをやってた？\\n\\nそういうことです。\\n\\nＱ：松下さんの世代になると、中学生でイカ船に乗り込むっていうことはもうなかった？\\n\\nうちの年はないですね。うちらより４つか５年上でほとんどなくなってるというか、まぁ徐々にね。もう、うちのときはほとんどないですね。\\n\\nＱ：松下さんは、漁業を継ごうという気持ちはなかったんですか？\\n\\n最初はもう、中学校終わったら漁業やって、イカ釣りしようかと。それがごく普通の、この辺のね、うちらのなかの職業意識ですよね、みんなね。もう高校へ行くということはほとんどなかったですよね。（六ヶ所村には）高校もないし。（高校に）行くにも町の方へ出なきゃならないから、もう大変なね、経済的にも大変でしたからね。\\n\\nええとね、うちの同級生が１４０（人）ちょっとあるけども、高校行ったのは男女合わせて１０人いるかな。１２～１３人かな。あとはもう漁業か就職ですよね、集団就職か。\\n\\nＱ：松下さんは漁業には行かなかった。漁師さんの息子だけども漁業には行かなかったのは、何か理由があるんですか？\\n\\nそうですね。中学校に行ってたときね、うちの一番上の長男が船の事故で亡くなってるから。当時はもう全国的にバーッと（話題に）なった、３０名近く犠牲になったイカ釣り船の遭難事故で亡くなってるから。それでうちの親がね、「もう漁師はいい」ということで、「就職して手に職付けなさい」ということで。まぁ就職ということで、中学校１年のときに（進路希望を）変えた。それがなけりゃ漁業でしょうね。\\n\\nＱ：就職は自動車？\\n\\nそうです。愛知県ですね。\\n\\nＱ：トヨタ。\\n\\nトヨタ自動車ですね。\\n\\n青森から、青森県の就職する人は集団全部、一緒に夜汽車で行ったから。\\n\\nＱ：夜汽車で？\\n\\nそうです。汽車でね、全部。北海道の一部と青森と、我々と、ずっとこう岩手から全部ひとつの汽車でね、上野、それから東海道線通って名古屋、それから大阪もいたのかな。\\n\\nＱ：それはみんな自動車会社に入る人っていうわけじゃなくて？\\n\\nうん。紡績会社だとか、いろんな会社の人たちがまとめて行ったから。うちらが最後じゃないかな。その集団就職、列車を仕立てたというのはね。\\n\\nＱ：集団就職の専用列車ですか？\\n\\nそうです。専用列車です。\\n\\nＱ：じゃあ、乗ると同じ年ごろの・・\\n\\n全部。\\n\\nＱ：たくさん乗ってるわけ。\\n\\nもう専用の列車ですね。\\n\\nＱ：それは、どういう気持ちでした？　ずーっと愛知県まで延々・・。\\n\\nどういう気持ちって・・中学校終わったら働くということは、何かのかたちで働くということがもう当たり前だというように。周りがそうだから。\\n\\nワクワクしてましたよ。やっぱり田舎から出たことないからね。愛知県というね、名古屋という大都会の方へ行けるんだというものと、それからやっぱり向こうへ行って働きながら高校へ通えるという、勉強ができるというのもひとつ楽しみだったよね。\\n\\nＱ：昼は工場で働いて、夜、定時制高校に行くっていう・・。\\n\\nそうですね、通信（制）とね。\\n\\nＱ：通信と。\\n\\nそういうようなのでね。だから、そういう楽しみもあったよね。\\n\\nＱ：それが何と言うのかな、採用のときの約束になってるわけですか？\\n\\nそうそう。働いてから３年間でね、会社の高等学校の課程は終了させますよ、と。そして、あと１年はね、その通信で足りない単位を取れば高等学校の卒業の資格がもらえますよ、というようなことで。３年間はトヨタ自動車の学校で習って、３年間終わって、もう１年は足りない分を通信（制）の高校で単位を取って、それで高等学校卒業の・・という。だからもう、就職しながら、高卒の終わったというあれが欲しかったわけよね。だから、みんな頑張ったんじゃないかな。一緒の仲間はみんなほとんど頑張ったよね。\\n",[81],"2013_11_30",506.639,"/das/image/D0001810/D0001810087_00000_C_001.jpg",{"1":85},{"name":26,"nameRuby":27,"category":71},{"type":75,"recId":87,"identifier":87,"clipNumber":88,"name":89,"description":90,"dateList":91,"startOffset":92,"endOffset":93,"thumbnailPath":94,"performers":95},"D0001810087_00000_002_0001","002","故郷に「巨大開発」が浮上した","そのとき・・昭和４３年～４４年のあたり、中学校のときに「むつ小川原開発」の話が出て、そのときに学校の社会の先生もね、こういう村でこういうのがあるけども、と。\\n\\n開発が来るよと。こういうふうな大きなね、石油コンビナートのね、将来的には２０万都市になるような大きな開発だよというようなことは記憶にあるけれども、あとは・・\\n\\nＱ：２０万都市？\\n\\nというのは記憶にあるんですよ。\\n\\nＱ：じゃあそういう話を聞いて、将来はここへまたそういう仕事で帰ってくることもできるかなと思いながら就職したって感じですか？\\n\\nそういうことですね。\\n\\nＱ：じゃあ、その開発がどうなるかみたいなのも愛知県から気にしてたっていう・・。\\n\\nええ、もう、しょっちゅうね、テレビ、新聞等にね、六ヶ所の開発の話題でね、いろんなの入ってましたからね。だから、六ヶ所の開発っていうものは向こうにいてもね、すごく気になってましたからね。\\n\\nＱ：どういう話題があったんですか？\\n\\nいやあ、あんまりいい話題じゃなかったよね、うん。ワイドショーなんか、六ヶ所の開発御殿ができたとか、そこでもう殺人事件があったとか、汚職事件があったとかなんとか・・。あんまり開発に関わるニュースっていうのが、いい方面のね、ニュースは聞こえなかったね。いろんな事件性のあるものばっかり報道されて。だから、「この開発が本当に必要なのかどうか」とか、そういうマイナス要因が多かったよね、報道されてるのが。こういう開発になればこういうふうに開けるんだっていうほうの、プラス思考のほうの報道があんまり少なかったような気がしたね。\\n\\nそんなニュースばっかり流れるから。悪いほうのニュースばっかりだから。いや、「開発」ってこんなに悪いのかなと思いながら。でも、あの六ヶ所がね、自分らのふるさと六ヶ所が開発することによって、いろんなね、雇用の場ができるっていうことがね、いちばんとにかく注目したところだからね。雇用の場ができれば出稼ぎしなくてもいいし、家族みんなで暮らせるから。・・だって家族でバラバラに暮らしてる人がほとんどだからね、盆と正月ぐらいしか家族がそろわないから。だから、みんなやっぱりね、通年で家族で生活できる、そういうところのほうがね、雇用の場があればそれができるでしょう。だから、期待してる方もいっぱいいたんじゃないかな。\\n",[],506.672,724.824,"/das/image/D0001810/D0001810087_00000_C_002.jpg",{"1":96},{"name":26,"nameRuby":27,"category":71},{"type":75,"recId":98,"identifier":98,"clipNumber":99,"name":100,"description":101,"dateList":102,"startOffset":103,"endOffset":104,"thumbnailPath":105,"performers":106},"D0001810087_00000_003_0001","003","「開発」に引き裂かれた故郷","Ｑ：で、こちらにお帰りになったのが、いつ頃ですか？\\n\\n昭和５３年かな。\\n\\nＱ：５３年。\\n\\n５３年か５２年・・どっちかな、そのあたりだね。\\n\\nＱ：その頃は、オイルショックがあって、開発が実際には工場も来なかった時期ですよね。泊はどんな雰囲気でしたか？\\n\\nやっぱり開発の賛成、反対でね、けっこう揺れてましたよね。それに絡めて、いちばんの開発の賛否両論をしたのが、当時の村長選において賛成派、反対派というのが真っ二つにね、村を二分してたからね。で、うちら帰ってきても、それがどういうことか分かんなかったから。それが、ああ凄い、こんだけ地域が揺れてるんだなと帰ってきて初めて分かったよね。\\n\\nＱ：まだ泊のなかでも対立が結構あったっていう感じでしたか？\\n\\nありましたね。結構やっぱり二分されてましたね。\\n\\nＱ：そうすると、帰ってきてちょっとびっくりした感じですか？\\n\\nうん、びっくりしましたね。\\n\\nＱ：で、お帰りになって、何のお仕事をなさったんですか？\\n\\n私、帰って来たのはね、ちょっと向こうでケガをして帰ってきたからね。だから、ケガが治るまで療養というかたちでね、仕事は定職には就かなかったんですよ。２年ぐらいね、療養しましょうということで、まぁちょっと労災で保険もらってたからね。だから、療養というかたちだから、すぐ定職は就かなかったけどね、だから逆に周りが見えたんですよね。\\n\\nＱ：どんなふうに見えましたか？\\n\\nなんか開発というものが・・昭和４０年代にきてからの開発というものが、なんか変な方向にね、村の人たちの雇用の場を作って村の幸福度を上げるというのかなと思ったのが、逆に地域を賛成と反対に分けて、地域の人たちがいがみ合ってるような構図がね、かいま見えたからね。あれ、ちょっとこれ違うんじゃないかなと思ってね。開発という名の下で地域が揺れてると、それがいがみ合ってるというような構図に見えたから、いや、ちょっとこれ違うんじゃないかな、と。別の方向になんか行ってる、と。賛成してるほうの人がいいみたいで、反対してる人たちが悪い人というような構図でね、なんか違うんじゃないかな、と。だから、おかしい方向になってるな、とは感じてたね。\\n\\nＱ：で、お仕事を始められたのが？\\n\\n昭和５５年だね。ケガも治ってね、さぁ何やろうかっていったときにね、私の兄がね、じゃあおまえ、せっかく今まで車の仕事やってたんだから、ここは車もないし、・・・もないし、それから備蓄（国家石油備蓄基地）の工事も始まると、いまに車の修理も増えるだろうと。だから、手の職を生かして、手がケガしてるからゆっくり自分のペースでやりながら・・ということで車の修理工場をね、まぁ兄がやれっていうことでね、やったんですよ、車の修理をね。\\n\\nＱ：ちょうど石油の備蓄基地の建設が始まる頃。\\n\\nそうです。\\n\\nＱ：じゃあ、お兄さんの思惑は当たりましたか？\\n\\n当たりましたね。やっぱりもう、すごいね、全国から作業車とか作業員たちが来てますからね。もうとにかく当時そんな修理工場とかなかったからね。だから、仕事はたくさんありましたね。\\n\\n開発というものの流れのなかでは恩恵を受けた方じゃないかな、と。昭和５５年のあたりはね、備蓄の工事始まったあたりはね、受けた１人だと思うわね。\\n\\nＱ：恩恵を。でもまあ、その石油備蓄基地というのも作ってしまえばおしまいみたいなところがあるから、その後の雇用には結び付かないっていうところはありますよね。\\n\\nそうですよね。でも、当時、そこまで考えていませんでしたね。ということは、いま建ってる備蓄（タンク）の向かいの正面側にね、また大きな造成工事があったからね。そこへまた別の、第２の備蓄みたいなのができるという計画を聞いたからね、じゃあこれはまた工事が始まるんだな、と。あとまた何年ぐらいいんだな、と。この備蓄のね、石油備蓄に関連した工場とかいろんな会社関係が張り付くのかなと。\\n\\nＱ：まあ、そうは結局ならなかったわけですね。\\n\\nうん。ところがそうならなかった、と。一期の、いまの第一期の備蓄の現状で終わって、次のそっちのほうの造成した方はそのままだと、そういう状況だから。\\n",[],724.857,1128.427,"/das/image/D0001810/D0001810087_00000_C_003.jpg",{"1":107},{"name":26,"nameRuby":27,"category":71},{"type":75,"recId":109,"identifier":109,"clipNumber":110,"name":111,"description":112,"dateList":113,"startOffset":114,"endOffset":115,"thumbnailPath":116,"performers":117},"D0001810087_00000_004_0001","004","浮上した核燃料サイクル構想　","覚えていますよ。昭和５９年のあたりにボンと（構想が）出たんだけども、その前からね、なんかその「核燃」というね、「サイクル」という言葉は出てましたからね、この地域ではね。また別のものが来る、大きな事業が来る、これは日本のエネルギーを左右するような大きな事業が来るんだというような話は流れてましたからね。その「核燃サイクル」という言葉自体が出たのは昭和５９年に入ってからだろうけども、その前触れの話というのはその前からありましたよ。\\n\\nＱ：じゃあ、これは（六ヶ所村も）よくなるかなという期待をお抱きになった？\\n\\nなりましたね。というより、「核燃」という意味がわからなかったから。「核燃」というのは会社の名前だと思ったんだ、「核燃」という会社。だから、その会社が何をやる会社なのかというのは分からなかった。会社の名前があって、「核燃」という大きな会社が来るんだなと。そしたら結局、説明を聞いていくうちに、その「核燃」というのは会社の名前じゃなく・・「核燃料サイクル」というなんかの略称なんだというのを覚えたのは後ですよね。で、サイクルというものも分かんないし、すべてのものが初めて聞く言葉だから。それで賛成、反対と言われても、「え？」と思ったのがほとんどの人じゃないの？\\n\\nＱ：松下さんだけじゃなくてね。\\n\\nうん。\\n\\nＱ：「核燃料サイクル」と言われても、何のことだかっていう・・。\\n\\nそうそう。特にこういう田舎の地域でね、核燃料サイクル・・ウランだとかプルトニウムだとかそういう言葉をね、元素記号の言葉だって分かるわけないでしょう、専門学校出てる方とかでなければ。で、それが、なんかすごく一人歩きしてね。日本ではこの核燃サイクルは必要なんだと、再処理というのが必要なんだと、じゃ、その再処理って何だと。で、説明会があって、いろいろね、何回も聞いたけども、それでもやっぱり分からなかったよね。もともとそういう、ウラン２３５が燃えるとか燃えないとか、２３８がどうのとかプルトニウムがどうだとか、中性子がどうだとかいうの誰も分かんないんだもん、専門的な知識がないから、基盤に。だから、いくら説明聞いても分かんなかった。で、それで賛成しなさい、反対しなさいって言われても、みんな「うーん、なんだろう？」「とりあえずまぁ、こっちのほうさ、みんないいって言うから賛成するか」とか。最初はそういう流れだったのね。\\nで、俺はなんか違うんじゃないかなと思ってね。これ、ちょっと普通の事業じゃないなというのは自分なりに感じたね。だから、自分で説明会を受ければ、その資料を見て、専門的に「いや、これちょっとどういう言葉なんだ？」と。（例えば）ウランの２３５、「原子力で燃やすのはウラン２３５という物質なんだ」と。で、それで中性子があればどうなるんだ、臨界とは何だ、とか・・そういう一つ一つの専門的な単語を勉強してたね。それ、単語を勉強したことによって、だんだんだんだん一つずつ個別で結びつけていくことによって全体像が見えてきた。\\nで、これって前代未聞の事業だな、と。でも、どんなもんかな、と。これがいいのか悪いのか、全く基礎的知識がないから判断はできなかったね。当時はみんな、ほとんどここの地域の人はそうじゃなかったのかな。まぁ我々も、聞くとみんな分かんないって。でも、国や県や村が安全だと言うからいいんでないかと、最後の落としどころはそこですよね。国、県、村が安全だと、安全を保証するんだと。そこによりどころがあって担保があったから、みんないいんでないかと。深くはみんな考えなかったんじゃないの？\\n\\nＱ：じゃあ、松下さんはどちらかと言えば推進派というふうに見られてたんですか？\\n\\nそうですね。推進派というよりも、うちの周り・・家族を含め、けっこう親戚関係狭いから、みんなも割合そう（賛成）だから。もうひとつ、やっぱり、当時反対した人たちが極論的だったわけ、うちから見ると。とにかく説明会行っても、なんでも全部反対だと、ダメだと。危ない、危ない、と。で、決め付けたお話しかできなかったから、しないから、いや、これちょっと違うんじゃない、話を聞こうよ、と。もう説明（会で）の話は問答無用でね、これは危ないんだと。危ないんだ、危ないんだという一方的なあれで話をね、説明会の話を遮るような行動が見えたからね、この人たちのあれはちょっと違うんじゃないかと。で、多くの・・わりとそういう考えを持った人は結構おったと思うわけよ。\\nそれからやっぱり、この事業が来てこうなると、雇用の面ではこういうふうになりますよ、と。だから今までの備蓄のときと違って一時的なものじゃない、と。ずーっと将来的にこの村を潤していく、と。そして、こういうことをやって、国の方としては交付金はこういうふうなものが出る、この交付金を使って村はこういう村づくりができると。ちゃんと青写真が見えてきたから、ああ、いいもんだなと。じゃあ、で、この事業を利用して、三法交付金を利用して、村づくりをして、町づくりをした地域はこことここですよと。だから、ここの町は今こうなってますと。この村は今こう発展してますよと。具体的にこう見せてくれる。\\n\\nＱ：ああ、よその地域もね。\\n\\nで、そこに見学に行く。やっぱり目で見てくる。\\n\\nＱ：どこへ見学に行きました？\\n\\n私はそんなに行かなかった。\\n私は行かなかったけど、よその人たちはやっぱりいまの福島だとか、東海村とか、それから新潟、石川県・・やっぱり当時の原発の立地県、そういうところに皆さん行きましたね。\\n\\nＱ：福島第一あたりも行ってるんだ。\\n\\n行きましたね。福島は特にみんな行ったんじゃないかな。それから新潟、石川県とか・・\\n\\nＱ：福井県とか。\\n\\n福井。あの辺も全部行きましたね。東海村は特にね、再処理（工場）はね。\\nそういうところの、交付金を使ってこういう施設を作っていますよ、こういうふうになりましたよ、というところをここの人たちがみな見学に行きましたよね。で、そこで考えを変えてね、ああ、やっぱり交付金をこういうふうに使って村を発展、町を発展したんだと、いい面をやっぱり見てきた、と。\\n\\n（泊地区では）明確な反対という意思表示してる人は一部で、不安だと思ってる人が半数以上あったんじゃないかな。だから、（漁業）組合の総会でも何でもね、意見が合わないで荒れたというのはそこにあるんじゃないかな。やっぱりみんな不安に思ってる人もおった。\\n",[],1128.46,1681.146,"/das/image/D0001810/D0001810087_00000_C_004.jpg",{"1":118},{"name":26,"nameRuby":27,"category":71},{"type":75,"recId":120,"identifier":120,"clipNumber":121,"name":122,"description":123,"dateList":124,"startOffset":125,"endOffset":126,"thumbnailPath":127,"performers":128},"D0001810087_00000_005_0001","005","「核燃」をめぐる対立の激化","私は当時その場所にいましたけどもね、「え？」と思いましたよ。開会宣言と同時にね、もう当時の組合長が流会してしまったから。「え？」と思ってね、「何？何？何？・・何があったの、起きたの？」というような感じでね。だから・・それはいまね、あとの話で聞くと、やっぱり反対派の方がいろんな面で（勝っていた）・・書面議決書とかいろんなものやっても（推進派の票は）集まらなかったと。だから、反対の方が多い、これは否決される、じゃぁまずいと。\\n\\nＱ：調査の受け入れ（が否決される）？\\n\\n海域調査を受け入れるかどうか・・漁業権と漁場のあれに関わる問題だから、それを総会で決議しなきゃなんないというものだから、それでかけた、年次総会やったと。ところが、書面議決書とかいろんなのを賛成派の人たちも集めたんだけど、思うように集まんなかったと。で、みんな関心があるから、本人出席が多かった。そこで、本人出席が多いということは反対派の方が人数が多いとそういうふうに当時の執行部というのかな、そういう人たちが判断をして、ああいうふうな暴挙に出たと。・・私は暴挙だと思ったね。「まさか、え？」と思ったから。「それはないだろう」と。\\n\\nＱ：そうか。推進派にいても、それはないだろう・・\\n\\nそれはないだろう、と。暴挙だろうと思いましたよ。\\n\\nＱ：で、その後、組合員の人たちが（会場に）残ってもう１回総会を招集するんですよね。　\\n\\nそうです。「反対派」と言われてる人たちが残って、いまの組合長が言った流会宣言は無効だ、総会が成立してない、まだ、と。要するに、総会を成立させるためには、まずもって組合員の出席人数を確認しなきゃならないわけ。正組合員が何名出席されたか、書面決議書は何名提出されたか、本人出席が何名、委任状が何名・・というようなこと全部報告をして、そして了解をもらって、そして議長選任をして、そして議案に入らなきゃダメだ。またその議案、またその議案を議長が提案しなきゃダメなわけだ。（組合長が流会の）宣言をポンと「これから議事を始めますよ」（という宣言）の前にやっちゃったから、だから無効だというのが一方の方々の意見であって、じゃぁこれは無効なんだと。だから・・この臨時総会の招集はまだ生きてると。で、新しい条文（議案）出せる、あのときは当時の役員の方が一部残ったのかな、だから役員も残ってるし・・。だから、もう１回やり直させると。で、自分たちで議長選任をして、議長が淡々とね、粛々と進めて、そして議決した。だから１日のうえで２つの議決が（なされて）、どっちが有効か無効かという話になって、下駄預けられた県の方もお手上げした、と。\\n\\nＱ：ともかく２つ、推進派のやる総会と反対派のやる総会が両方あるようなかたちになっちゃったわけ？\\n\\nまぁ結論的にはそういうことでしょうね。だから、要するに流会宣言した時点において賛成・推進（派）と言われている人たちが全部退席だと。それで残った人たちだけでやったということだから、そこでもう色分けされてるということでしょう。で、それでどっちがね、法的にも水協法（水産業協同組合法）に照らし合わせて・・水協（法は）水産のあれ（法律）だけども・・水協法でどっちが有効かというようなことで最後は争われたけどね。\\n\\nＱ：松下さんはその推進派が出るときに出たんですか？\\n\\n私は一緒に出ましたね、出ました。もう流会ということで。もうダメだ、と。なんもないから、流会ということだから、出ましたね。\\n\\nＱ：じゃあ、出た後、その決議をされたとかいうのは知らなかったわけだ。\\n\\nわかんなかったね、うん。後で報道で知りましたね。\\n\\nＱ：当時、その推進派のほうは、委任状の偽造とかっていうのも問題になりましたよね、その後。\\n\\nそれも報道されましたね。それがだから・・三文判を無断で使用して、代筆して、それを偽造したと。\\n\\nＱ：要するに、ひと（他人）の委任状を作って、三文判を押した？\\n\\nそうです、それが明るみに出た。結局それをやられた人が、いや、俺、何も出してない、と。結局、あのとき反対（派）だった人たちが、委任状とか署名議決書とか見たんでしょうね。で、誰々々が誰に委任したと、その反対の人たちが確認した、本人から。（すると）「いや、俺は出してない」とか、「いや、俺は書いてない」とかいうのがボロボロ出てきたから、結局あれは偽造だと。だから、あれは何にもなってないんだというようなことが聞こえていたから、（推進派が）そういうことをやったから、結局、うちらみたいにね、まあ反対じゃないんだけども、かといって強力な賛成派でもなかった人たちも「えー？」っと。・・このやり方はちょっと違うんじゃないか、という考え方を持ったのは結構いましたよ。\\n",[],1681.179,2117.215,"/das/image/D0001810/D0001810087_00000_C_005.jpg",{"1":129},{"name":26,"nameRuby":27,"category":71},{"type":75,"recId":131,"identifier":131,"clipNumber":132,"name":133,"description":134,"dateList":135,"startOffset":136,"endOffset":137,"thumbnailPath":138,"performers":139},"D0001810087_00000_006_0001","006","国家権力と漁民が衝突した“泊沖海戦”","機動隊がこう、ずーっとこう、この港を囲みましたよね。反対派の人たちは船を出さないように。\\n\\nＱ：（港の）向こう側？\\n\\n向こうです、ずーっとね。ここ（岸壁）はまだなかったから、当時。・・向こうですね、向こうの岸壁に機動隊が。\\n\\nＱ：それは、機動隊は何のために？\\n\\n要するに、反対の人たちが漁船を出して海域調査を妨害しないため。で、沖には海上保安部の巡視船が待機をして、陸では機動隊。そういうなかでも船を、漁業者が出す船を止めることはできないわけ、漁業権の侵害だから。だから、出る人は出たんだけども、出たら今度は沖の方で、海上保安部が、妨害しないようにということで（調査用の）ブイの周りを（固めていた）。\\n\\nＱ：要するに、反対の人たちには、できれば船に乗させないようにしようと。\\n\\nそういうこと。機動隊の方は、いや、お前たちは海域調査を妨害するんだろうと決めつけてるわけ。それが漁業者の方は「いや、俺らは漁をするんだ」「俺らは漁をするんだから、当たり前じゃないか、船を出すのが」・・だから、船出そうとする。\\n\\nだから、（機動隊のやり方は）強引なのさ。だから、よけい反発食うのさ、反発されるのさ。俺は陸（おか）で見てた。あの上で見たんだけども、そう思ったもん。\\n\\nＱ：どういうふうに？\\n\\n漁に出る漁業者に船を出させないということはおかしいでしょうと。で、それはもう、お前たちは海域調査を妨害するために行くんだろうと決めつけているから。ただ行こうとする人を機動隊が抑えたりしてるから、そういうなかにおいて、もみ合いになってるなかにおいて、ほれ、逮捕された人もいるわけ。なんかこう、いろいろ罪名を作ってね、公務執行妨害だとか。それで実際逮捕された人もいるわけ。\\n\\nＱ：あのとき、短い間に何人もの人が逮捕されてますよね。じゃあ、中村勘次郎さん（当時の反対派漁民）とか、亡くなられた・・なんかは、そこをすり抜けて（沖に）出たんだ？\\n\\nそういうことじゃないのかな。だって、出てるからね、何艘か出てね。ああいうふうな映像が撮られてるからさ。\\n\\nＱ：松下さん、どこで見てたんでしたっけ？\\n\\n私はね、あの・・・道の上。ここから行くとさ、こうだから、あの上だね、そこのちょっと上の方。\\n\\nＱ：青い屋根の家がある？\\n\\nあそこの青い屋根の上の方。あの、あれがある、擁壁が。・・の上。\\n\\nあそこへみんな（地元の住民が）ずーっといましたから。私はそこで見てた。\\n\\nＱ：そうするともう、港は、たくさんの機動隊と・・。\\n\\nうん、もう、ずーっと並んでるから。初めて見てびっくりしたよ。\\n\\nＱ：初めて？\\n\\n初めて、あんだけ・・。機動隊があんだけいて、盾を持って重武装っていうの？・・してるのは、国会でしか見れない風景でしょう、何とかの学生のデモだとか、何とかデモだとかやってる。・・見たことないから、この田舎でああいうものがあるっていうのは。\\n\\nだから、ここまで国家権力が入ってやらなきゃならない事業なんだろうな、と。この海域調査というのも、一つの通過点としてやらなきゃならないと。そういう、それをするためには、こういうこともやるんだなと思ったもん。\\n\\n国がやるというと凄いもんだと思ったよ。凄いというのは、その意味では国家権力というのか、そういう力の強い、やると言ったらやると。もう彼らたちはものすごい権力を持っているから、だからあれだけの機動隊、沖には海上保安部・・もう国家権力、警察権力、海と陸の警察権力が両方構えて、そのなかでどうして（漁民が）太刀打ちできる？・・できないでしょう？・・だから、もう亡くなった中村勘次郎さんからちょっとお話聞いたけど、ひどいもんだと・・。実感として分かる、この上から見とったから。\\n\\n上から見てそう思ったもん。上からいっぱい（泊の住民が）見てたけどさ、みんなやっぱりそう思ってたもん。おい、凄いな、ここまでやるのか、と。だから、みんなおんなじ意見だもん。で、そのときもね、上の方にも警察官いるんだよ。それから地域のね、道路の入口、港の入口とか、みんな警官立ってるから。で、上の方にも警察官がいましてね、で、やっぱりほれ、監視してるというのか、我々を見てるの。見学してるのも監視してる。で、なんかこうビデオ回してるの。誰が、どういう人がいるのか？・・だから、凄いもんだなと思った。\\n",[],2117.248,2521.452,"/das/image/D0001810/D0001810087_00000_C_006.jpg",{"1":140},{"name":26,"nameRuby":27,"category":71},{"type":75,"recId":142,"identifier":142,"clipNumber":143,"name":144,"description":145,"dateList":146,"startOffset":147,"endOffset":148,"thumbnailPath":149,"performers":150},"D0001810087_00000_007_0001","007","「核燃凍結」という選択","やっぱりいまの（村民同士が対立する）状況はよくないだろうと。だから土田さんがあんとき、（それまでは）同じ推進やってきたけども、土田さんが（村長選挙に）出たでしょう、分かれて。そのときに出たのが、あまりに強引すぎる、やり方がちょっと違うんじゃないかというようなことで、当時の与党から（割って）出たから。で、その考え方に（自分も）その通りだと。もう１回立ち止まって考えましょう、というようなことに賛同したわけ。だから、土田さんそのものが、開発は反対だとか、・・・に反対だとか、反対を唱えてのあれじゃなかったから。\\n\\nＱ：「凍結」でしたよね。\\n\\nそうそう、「凍結」だ。んだ、んだ、いい言葉だよね、当時はね。\\n\\nＱ：でも、結局、土田さんが（核燃料サイクルを）受け入れるような形になっちゃうんですよね？\\n\\nそれはもう、最初からみんな分かってたからね。「凍結」って言ったって必ず融けるんだと。ただ、そのときに勝つために選挙しようとして、この地域をいったん落ち着かせようと、そして話し合いをできる雰囲気を作ろうと。特にいちばん、六ヶ所の最大集落の泊地区を落ち着かせようというのが土田さんの考えだったからね。\\n\\nＱ：そうか。凍結というのは「そのうち融けるもの」だと。\\n\\n俺はそう思ってるけどね。みんな、そう思ったんじゃない？・・だから、土田さんのその考え方に泊の当時の議員たちがね、古泊さんでしょう、辻浦さん、それから滝口さん、中村さん、もう４人いるうちの３人が土田さんの方に付いたでしょう。ということは、その人たちも土田さんの考えに賛同したということでしょう、（いままでが）あまりにも強引過ぎるから、ちょっと立ち止まろうと。その流れが六ヶ所で強くなった、で、変わったということでしょう。\\n\\nＱ：開発に反対というよりも、古川村長のやり方が強引過ぎると。\\n\\nまぁそういうふうに、最後、判断したんじゃないかな。だから、強引だとか強引でないとかいう結論はちょっとできないだろうけどもね、当時の人たちは（強引にでも）そうやらなければこの事業は進まないという考え方を持っただろうし。その人たちにとっては、これをやらなきゃ、もうこの事業は頓挫してしまうという危機感もあっただろうし。だから、当時はどっちがいいとか悪いとかじゃないと思うけどね。ただ、多くの人が賛同したのは、やっぱり状況が良くない、ちょっと落ち着こうと。１回立ち止まろうということにみんな賛同したんだと思う。\\n",[],2521.485,2762.459,"/das/image/D0001810/D0001810087_00000_C_007.jpg",{"1":151},{"name":26,"nameRuby":27,"category":71},{"type":75,"recId":153,"identifier":153,"clipNumber":154,"name":155,"description":156,"dateList":157,"startOffset":158,"endOffset":159,"thumbnailPath":160,"performers":161},"D0001810087_00000_008_0001","008","防波堤に描いた子どもたちの祈り","Ｑ：これは誰と誰が握手してるんですか？\\n\\n漁業者同士がね、お互いに握手してるの。これが手でしょ。ここにもう１つあったの、それがもうすごい評判を呼んだの。\\nすごくいいと、これがいいということで握手してるとこ・・。\\n\\nＱ：当時の願いが込められてますね。\\n\\nだから、私さっき言った（ように）、この地域をこういうイベントでね、なんとか融和させようとしたから。最初は向こう。向こうからの物語風になってる。\\n\\nＱ：そうなんだ。\\n\\nだから、こっちから来るより、向こうから来るほうが。\\n\\nＱ：じゃあ、向こうへちょっと行ってみましょう。\\n\\nこれね、最初ね、題が「泊・夢・未来」。題を作って、中学校の子どもたちにね、この「泊・夢・未来」という題で、あなた方この地域を将来どうしたいか、現在どうなのかってことで美術の時間に（時間を）取ってもらって、美術の先生と相談して。で、先生が子どもたちに描かしてくれたんですよ。その中からピックアップをして、そしてこれを選んだんですよ。\\n\\nまず、とにかく自然豊かで、魚も漁もいっぱいある泊・・これがいちばん絵が多かったんですよ。で、ここはカモメの声が聞こえる、静かなね、そういう村だと。静かな村なんだと。ごとごとしない、騒々しい、騒がしい村じゃないんだというようなことで、子どもが貝を当てて音を聞いてるわけ。その絵がね、１人あったんですよ。で、これはもう最高だと。これを最初に持ってこようということで選んだんですよ。\\n\\nで、２年目もね、こういうふうにして、また「泊・夢・未来」で次の年の子どもたちに描かしたんですよ。次の子どもたちが、前の人たちのを見てるから自分たちもやりたいというようなことで話がきて、じゃぁ、あなた方の今年もやろうということで、また５０メートルという（長さに絵を描く）予算をもらって。そのときに出してくれたのが、子どもたちがまたこういうふうにね、和気あいあい、子どもたちが祭りを喜んでる絵を描いたんですよ。\\n\\nＱ：子どもたちの笑顔ですね。\\n\\nもう、これだけ笑顔がいっぱいあるんだということでね。だからこれはね、描いたときに漁師の方々がね、いい絵だと。だから、誰もね、いたずらしないんですよ。よそ行くと、みんないたずらするでしょう、ペンキを塗られたとかって。だから、誰もここね、いたずらする人いないんですよ。というのは、ほれ、子どもたちが描いて、一生懸命やってるのを見てるから。ということは、やっぱりここの人たちはそういうものには、いいものには、すぐ反応して協力してくれると。\\n\\nで、最後のときに、今度はここにきて。次の年、３年目にね、この絵があったんです。で、これはもっとあったんだけどね。まだあったんだけども、ちょっと工事でね、防波堤が壊されてしまったけども。ここまで壊してたのがね、やめてくれと、ここだけ残してくれと。\\n\\nＱ：あ、そうなんだ。\\n\\n言ったんだけども、どうしてもほれ、工事の関係でそこは取らなきゃダメだということで、ここだけは残してもらったんですよ。\\n\\nＱ：握手のところだけは残った・・。\\n\\nここの握手のところね。ここは組合に行ってね、あそこだけは何とか残してくれと。あれがいちばんのね、ここの地域に訴える子どもたちのメッセージだから、と。で、ここに残してもらったんですよ。ほれ、周りは子どもたちがね、みんな笑顔でしょう？\\n\\nＱ：これ、２０年ですか、ほとんど。\\n\\nだから、これ、またいま何か手直しかけて新しくしようかなと思って。\\n\\nＱ：２０年前の夢、ね。\\n\\nだからいま・・・いま現在、この地域はどうなってるかというと、さっきも言ったけど核燃賛成、反対という議論もなくなって落ち着いてるし。まぁそれが反対という声が賛成に回ったというわけじゃない、根深く不安は残ってるけども、やっぱり、そういう元みたいにいがみ合ってやるような地域じゃなくなった、と。やっぱり何かあっても、いまはもう話し合いすると。\\n",[],2762.493,3113.376,"/das/image/D0001810/D0001810087_00000_C_008.jpg",{"1":162},{"name":26,"nameRuby":27,"category":71},{"profileText1":28,"displayName":164,"performerDescription":23,"dateOfInterview":165,"profileText2":166},"戦後史証言プロジェクト：日本人は何をめざしてきたのか：２０１３年度「地方から見た戦後」：第７回　下北半島　浜は核燃に揺れた","reserved-41608x1F","\u003Cdt>１９５５年\u003C/dt>\u003Cdd>六ヶ所村・泊地区に漁師の四男として生まれる\u003C/dd>\\n\u003Cdt>１９７１年\u003C/dt>\u003Cdd>中学卒業後、集団就職で愛知県のトヨタ自動車工場へ\u003C/dd>\\n\u003Cdt>１９７７年\u003C/dt>\u003Cdd>トヨタを退職、六ヶ所村に帰郷する\u003C/dd>\\n\u003Cdt>１９８０年\u003C/dt>\u003Cdd>六ヶ所村の石油備蓄基地建設に伴い、自動車修理工場を始める\u003C/dd>\\n\u003Cdt>１９８５年\u003C/dt>\u003Cdd>村長選挙で核燃料サイクルの立地推進を訴える候補を応援\u003C/dd>\\n\u003Cdt>１９８９年\u003C/dt>\u003Cdd>村長選挙で核燃料サイクル凍結を主張する候補を応援\u003C/dd>\\n\u003Cdt>１９９５年\u003C/dt>\u003Cdd>自動車修理工場を閉鎖し、泊地区の国道沿いに焼鳥屋を開業\u003C/dd>\\n\u003Cdt>２０１２年\u003C/dt>\u003Cdd>新聞販売店の経営を始める\u003C/dd>\\n",{"archivesProgramIdentifier":168,"postwarNewsIdentifiers":169,"testimonryClipIdentifiers":170},"D0001820017_00000",[],[],{"1":172},{"name":23,"nameRuby":23},{"1":174},{"name":26,"nameRuby":27,"jobTitle":70,"description":166},{"category":23,"keywords":176,"questions":177,"yearHint":23},[],[],{"prefecture":179,"address":23,"latitude":23,"longitude":23,"precision":23,"building":23,"hasmap":180},[14],{"name":23,"url":23},{"date":81,"name":23},{"tvSeriesId":23,"tvSeasonId":23,"tvEpisodeId":23,"radioSeriesId":23,"radioSeasonId":23,"radioEpisodeId":23,"webContentId":23,"archivesIdArchivesdb":23,"archivesIdOpenLibrarydb":23,"archivesIdNod":23},"",{"_layout":185},"archives-movies-jidai",{"T9s4bv5lzU":23},true,"/archives/movies/?id=D0001810087_00000"]</script>
